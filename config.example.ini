; Copy this file to config.ini and fill in your own values.
; config.ini is listed in .gitignore so you never accidentally commit your keys.

[woocommerce]
site_url = https://example.com
consumer_key = ck_your_key_here
consumer_secret = cs_your_secret_here

[template_product]
; The ID of an existing product to copy price / type / categories / images from.
; You can see this in the URL when editing it in wp-admin: post.php?post=ID
product_id = 123
; "draft" while testing, "publish" once you trust the result.
publish_status = draft
; Which top-level WooCommerce fields to copy from the template product.
; See https://woocommerce.github.io/woocommerce-rest-api-docs/#product-properties
; for the full list of available fields.
copy_fields = type,regular_price,sale_price,manage_stock,stock_status,downloadable,virtual

[excel]
path = products.xlsx
; Row number of the header row (data starts on the next row).
header_row = 1
; Column used to mark a row as processed, so re-running the script skips it.
; Leave blank to disable this (every run will try every row again).
status_column = H
done_value = done
error_value = error

[columns]
; Map each placeholder name (used in your template files, e.g. {brand})
; to the Excel column letter that holds it. Add or remove as many as you need —
; "name" is used for the product title if you don't use a title_file, and for
; log messages either way.
name = A
brand = B
model = C
format = D
board_no = E
capacity = F
rev = G

[templates]
; Optional: a template for the product title. If omitted, the "name" column is
; used as-is for the title.
title_file = templates/title.txt
description_file = templates/description.txt
; Optional.
short_description_file = templates/short_description.txt
; Optional: builds the slug from a template (same placeholders as above),
; then slugifies it. If omitted, WooCommerce auto-generates the slug from the title.
slug_template = {brand}-{model}-{board_no}-{capacity}

[seo]
; If you use the Rank Math SEO plugin and want the Focus Keyword set
; automatically on each new product (equal to the generated title).
set_focus_keyword = false
focus_keyword_meta_key = rank_math_focus_keyword

[request]
; Some hosts / security plugins block the default python-requests User-Agent
; as "bot-like" traffic. A normal browser User-Agent avoids most 403 errors.
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
; Seconds to wait between requests, to be polite to the server.
delay_seconds = 1.5
timeout_seconds = 30
